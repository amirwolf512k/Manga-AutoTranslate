name: API Test Round 2 (CN sources + mangaplus fix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapters-cn:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: dmm,  n: "chaoren-ep10",   url: "https://www.dongmanmanhua.cn/BOY/chaorendeshidai/%E7%AC%AC9%E8%AF%9D/viewer?title_no=1604&episode_no=10",       lang: "zh" }
          - { site: dmm,  n: "daizun-ep9",     url: "https://www.dongmanmanhua.cn/ANCIENTCHINESE/daizunmilu/%E7%AC%AC9%E8%AF%9D-%E8%80%81%E9%BC%A0/viewer?title_no=2827&episode_no=9", lang: "zh" }
          - { site: dmm,  n: "dafeng-ep9",     url: "https://www.dongmanmanhua.cn/BOY/dafengshounemowangdaren/%E7%AC%AC9%E8%AF%9D/viewer?title_no=2783&episode_no=9",             lang: "zh" }
          - { site: zymk, n: "cn-100-direct",  url: "FILE", lang: "zh" }
    env:
      COARENA_KEY: ${{ secrets.TEST_COARENA_KEY }}
      COARENA_BASE: ${{ secrets.TEST_COARENA_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

      - name: Install python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt beautifulsoup4 google-genai

      - name: Run full chapter (${{ matrix.site }} ${{ matrix.n }})
        run: |
          set -o pipefail
          OUT="out_${{ matrix.site }}_${{ matrix.n }}.pdf"
          if [ "${{ matrix.url }}" = "FILE" ]; then
            URLS=$(tr -d '\n' < .ci_tmp/zymk_urls.txt)
            echo "[*] ورودی مستقیم: $(echo "$URLS" | tr ',' '\n' | wc -l) عکس zymk"
            python3 manga.py \
              -i "$URLS" \
              -o "$OUT" \
              --provider custom \
              --api-base "$COARENA_BASE" \
              --model gpt-6-luna \
              --api-key "$COARENA_KEY" \
              --font fonts/Sahel-Bold.ttf \
              --no-style-fonts \
              --api-timeout 120 \
              --batch-workers 2 \
              --ocr-lang ${{ matrix.lang }} \
              2>&1 | tee run.log
          else
            python3 manga.py \
              -i "${{ matrix.url }}" \
              -o "$OUT" \
              --provider custom \
              --api-base "$COARENA_BASE" \
              --model gpt-6-luna \
              --api-key "$COARENA_KEY" \
              --font fonts/Sahel-Bold.ttf \
              --no-style-fonts \
              --api-timeout 120 \
              --batch-workers 2 \
              --ocr-lang ${{ matrix.lang }} \
              2>&1 | tee run.log
          fi
          echo "---- خروجی ----"
          ls -la "$OUT" || echo "[!] خروجی ساخته نشد"

      - name: Collect translations
        if: always()
        run: |
          mkdir -p chtrans
          d="out_${{ matrix.site }}_${{ matrix.n }}.cache"
          if [ -f "$d/trans.json" ]; then
            cp "$d/trans.json" "chtrans/${{ matrix.site }}_${{ matrix.n }}_trans.json" || true
          fi
          ls -la chtrans/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-chapter-${{ matrix.site }}-${{ matrix.n }}
          path: |
            out_*.pdf
            run.log
            chtrans/
          if-no-files-found: warn

  chapter-mangaplus:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      COARENA_KEY: ${{ secrets.TEST_COARENA_KEY }}
      COARENA_BASE: ${{ secrets.TEST_COARENA_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

      - name: Install python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt beautifulsoup4 google-genai

      - name: Discover free chapter (One Piece — robust decode)
        run: |
          python3 - <<'PY'
          import gzip, json, urllib.request, zlib
          url = ("https://jumpg-webapi.tokyo-cdn.com/api/title_detailV3"
                 "?title_id=100020&clang=English")
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json",
              "Accept-Encoding": "identity"})
          with urllib.request.urlopen(req, timeout=60) as r:
              raw = r.read()
          print("bytes:", len(raw), "head_hex:", raw[:16].hex())
          body = None
          for name, fn in (
                  ("gzip", gzip.decompress),
                  ("deflate", lambda b: zlib.decompress(b)),
                  ("deflate-raw", lambda b: zlib.decompress(b, -15))):
              try:
                  body = fn(raw).decode("utf-8", "ignore")
                  print("decoded as:", name)
                  break
              except Exception:
                  pass
          if body is None:
              body = raw.decode("utf-8", "ignore")
          print("head:", body[:220])
          if "banned" in body.lower():
              raise SystemExit("mangaplus این IP را بن کرده است")
          d = json.loads(body)
          found = []
          def walk(o):
              if isinstance(o, dict):
                  if isinstance(o.get("chapterId"), int):
                      found.append(o)
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for v in o:
                      walk(v)
          walk(d)
          print("chapter nodes:", len(found))
          free = [c for c in found if not c.get("isLocked")]
          if not free:
              raise SystemExit("هیچ فصل آزادی پیدا نشد")
          c = free[0]
          print("picked:", c.get("chapterId"), c.get("chapterSubtitle"))
          open("/tmp/mp_cid.txt", "w").write(str(c["chapterId"]))
          PY
          cat /tmp/mp_cid.txt

      - name: Run full chapter (mangaplus ja)
        run: |
          set -o pipefail
          CID=$(cat /tmp/mp_cid.txt)
          python3 manga.py \
            -i "https://mangaplus.shueisha.co.jp/viewer/$CID" \
            -o out_mangaplus_ja.pdf \
            --provider custom \
            --api-base "$COARENA_BASE" \
            --model gpt-6-luna \
            --api-key "$COARENA_KEY" \
            --font fonts/Sahel-Bold.ttf \
            --no-style-fonts \
            --api-timeout 120 \
            --batch-workers 2 \
            --ocr-lang ja en \
            2>&1 | tee run.log
          ls -la out_mangaplus_ja.pdf || echo "[!] خروجی ساخته نشد"

      - name: Collect translations
        if: always()
        run: |
          mkdir -p chtrans
          if [ -f "out_mangaplus_ja.cache/trans.json" ]; then
            cp "out_mangaplus_ja.cache/trans.json" chtrans/mangaplus_trans.json || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-chapter-mangaplus-ja
          path: |
            out_mangaplus_ja.pdf
            run.log
            chtrans/
          if-no-files-found: warn
