name: debug-app-path
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diag = dump app code + cli baseline | repro = app-style translate fake'
        required: false
        default: 'repro'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System deps
        run: sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev
      - name: Fetch test images (exact user inputs)
        run: |
          curl -fL -A "Mozilla/5.0" "https://cdn.asurascans.com/asura-images/chapters/raising-villains-the-right-way/51/412e9e.webp?v=1788462175" -o 412e9e.webp
          ls -la 412e9e.webp ci_imgs/IMG_20261018_140944_899.jpg
      - name: Bootstrap python deps (manga.py auto-install)
        run: |
          python -c "import manga" 2>&1 | tail -5 || true
      - name: App-style translate repro (fake, no API)
        run: |
          python3 -c "
          from PIL import Image
          im = Image.open('412e9e.webp')
          im.crop((0,3900,900,5700)).convert('RGB').save('/tmp/plaque_page.jpg', quality=95)
          "
          echo "===== APP-STYLE fake-translate on plaque crop ====="
          python3 manga.py -i /tmp/plaque_page.jpg -o out_app_style --font fonts/Vazir-Code.ttf --provider gemini --workers 2 --bubbles-per-request 6 --api-timeout 40 --quality 92 --batch-workers 3 --max-retries 8 --request-delay 0.0 --temperature 0.85 --reading-order rtl --clean-method lama-manga --fake-translate --debug 2>&1 | tail -60 || true
          echo "===== APP-STYLE fake-translate FULL strip 412e9e ====="
          python3 manga.py -i 412e9e.webp -o out_app_style_full --font fonts/Vazir-Code.ttf --provider gemini --workers 2 --bubbles-per-request 6 --api-timeout 40 --quality 92 --batch-workers 3 --max-retries 8 --request-delay 0.0 --temperature 0.85 --reading-order rtl --clean-method lama-manga --fake-translate --debug 2>&1 | tail -40 || true
          echo "===== APP-STYLE fake-translate 1018 ====="
          python3 manga.py -i ci_imgs/IMG_20261018_140944_899.jpg -o out_app_style_1018 --font fonts/Vazir-Code.ttf --provider gemini --workers 2 --bubbles-per-request 6 --api-timeout 40 --quality 92 --batch-workers 3 --max-retries 8 --request-delay 0.0 --temperature 0.85 --reading-order rtl --clean-method lama-manga --fake-translate --debug 2>&1 | tail -40 || true
      - name: CLI baseline (both clean methods, plaque crop)
        run: |
          echo "===== CLI --lama ====="
          python3 manga.py -i /tmp/plaque_page.jpg -o out_cli_lama --clean-only --font fonts/Vazir-Code.ttf --cpu --lama --debug 2>&1 | tail -30 || true
          echo "===== CLI lama-manga ====="
          python3 manga.py -i /tmp/plaque_page.jpg -o out_cli_manga --clean-only --font fonts/Vazir-Code.ttf --cpu --clean-method lama-manga --debug 2>&1 | tail -30 || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-out
          path: |
            out_app_style/
            out_app_style_full/
            out_app_style_1018/
            out_cli_lama/
            out_cli_manga/
          if-no-files-found: ignore
          retention-days: 5
