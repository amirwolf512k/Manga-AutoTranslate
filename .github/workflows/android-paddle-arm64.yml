name: Paddle-Lite OCR on real arm64 emulator (dispatch only)

# v1.14.106 — تستِ «واقعیِ» Paddle-Lite/OpenCL:
# کتابخانهٔ libpaddle_lite_jni.so فقط arm64 است و شبیه‌سازِ x86_64ِ
# android-emulator.yml نمی‌تواند لودش کند (پایتون خودش به ONNX می‌رود).
# این ورک‌فلو «فقط با dispatch» — امولاتورِ arm64 (بدونِ KVM، با TCG —
# بوتِ کند) — را بالا می‌آورد تا مسیرِ Lite/OpenCL واقعاً آزموده شود.
# هشدار: بوتِ arm64 رویِ رانرِ x86 خیلی کند است (۱۵ تا ۴۵ دقیقه).

on:
  workflow_dispatch:
    inputs:
      ocr_lang:
        description: 'زبانِ OCR تست'
        type: choice
        options: [en, ko, ja, zh]
        default: en

permissions:
  contents: read

jobs:
  paddle-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Python 3.10 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch vendored Python packages + Paddle-Lite libs
        run: |
          python3 android/scripts/fetch_vendor.py --check || \
            python3 android/scripts/fetch_vendor.py
          python3 android/scripts/fetch_paddle.py
          python3 android/scripts/fetch_paddle.py --check

      - name: Sync engine sources into APK
        run: python3 android/scripts/sync_sources.py

      - name: Inject version from VERSION
        run: |
          VC=$(sed -n 's/^versionCode=//p' VERSION | tr -d '[:space:]')
          VN=$(sed -n 's/^versionName=//p' VERSION | tr -d '[:space:]')
          sed -i -E "s/versionCode = .*/versionCode = $VC/; s/versionName = .*/versionName = \"$VN\"/" \
            android/app/build.gradle.kts

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build arm64 APK
        working-directory: android
        run: |
          gradle :app:assembleDebug -PappAbis="arm64-v8a" -PlegacyJni=true \
            -PchaquopyBuildPython="$(command -v python3)"
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/MangaTranslator-arm64.apk

      - name: Prepare assets (small test image + OCR nb models not needed — runtime downloads)
        run: |
          mkdir -p /tmp/mt/imgs
          curl -sL --max-time 120 -o /tmp/mt/imgs/01.jpg \
            "https://raw.githubusercontent.com/amirwolf512k/Manga-AutoTranslate/main/examples/01.jpg" || true
          # تصویرِ کوچک برایِ بوتِ سریع‌ترِ مسیر — 01.jpg بزرگ است؛ ولی
          # مدلِ nb در اولین اجرا از ریلیز دانلود می‌شود (اینترنتِ رانر آزاد است)
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new("RGB", (800, 300), "white")
          d = ImageDraw.Draw(img)
          f = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 42)
          d.text((30, 40), "PADDLE LITE ARM64", font=f, fill=(10, 10, 10))
          d.text((30, 140), "extraction smoke test", font=f, fill=(10, 10, 10))
          img.save("/tmp/mt/imgs/small.png")
          print("small.png ready")
          PY

      - name: Install platform-tools (adb)
        run: |
          P="$ANDROID_HOME/platform-tools/adb"
          if [ ! -x "$P" ]; then yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" > /dev/null 2>&1 || true; fi
          "$P" start-server || true

      - name: Create arm64 AVD
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          yes | "$SDKM" "system-images;android-30;google_apis;arm64-v8a" > /dev/null 2>&1 || true
          echo no | "$AVDM" create avd -n parm64 -k "system-images;android-30;google_apis;arm64-v8a" -d pixel_4 --force
          CFG=$("$AVDM" list avd | grep -A5 'Name: parm64' | grep 'Path:' | awk '{print $2}')
          CFG="${CFG:-$HOME/.android/avd/parm64.avd}"
          mkdir -p "$HOME/.android/avd"
          ln -sfn "$CFG" "$HOME/.android/avd/parm64.avd"
          INI="$(dirname "$CFG")/parm64.ini"
          if [ -f "$INI" ]; then ln -sfn "$INI" "$HOME/.android/avd/parm64.ini"; else printf 'avd.ini.encoding=UTF-8\npath=%s\n' "$CFG" > "$HOME/.android/avd/parm64.ini"; fi
          echo "hw.ramSize=4096MB" >> "$CFG/config.ini"

      - name: Boot arm64 emulator (TCG — slow)
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/emulator/emulator" -avd parm64 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096 > /tmp/emu_boot.log 2>&1 &
          OK=0
          for i in $(seq 1 240); do
            V=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$V" = "1" ]; then OK=1; echo "boot completed after ~$((i*5))s"; break; fi
            if [ $((i % 24)) = 0 ]; then echo "--- boot wait $((i*5))s ---"; tail -2 /tmp/emu_boot.log; fi
            sleep 5
          done
          if [ "$OK" != "1" ]; then tail -40 /tmp/emu_boot.log; exit 1; fi
          adb shell input keyevent 82 || true

      - name: Run APK with Paddle-Lite (arm64/OpenCL path)
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          set -x
          PKG=com.amirwolf.mangatranslator
          APP=/data/user/0/$PKG/files
          mkdir -p pal-artifacts
          adb install -r -t dist/MangaTranslator-arm64.apk
          adb push /tmp/mt/imgs/small.png /data/local/tmp/pl.png
          adb shell "run-as $PKG sh -c 'cat /data/local/tmp/pl.png > $APP/pl.png'"
          PREF=$(printf '<?xml version="1.0" encoding="utf-8" standalone="yes" ?>\n<map>\n    <string name="inp_upload_path">%s/pl.png</string>\n    <string name="fake_test">true</string>\n    <string name="clean_only">true</string>\n    <string name="clean_method">opencv</string>\n    <string name="out_fmt">PDF</string>\n    <string name="reader">rtl</string>\n    <string name="ocr_engine">paddlelite</string>\n    <string name="ocr_lang">${{ inputs.ocr_lang }}</string>\n    <boolean name="battery_asked" value="true" />\n</map>\n' "$APP" | base64 -w0)
          adb shell "run-as $PKG sh -c 'mkdir -p $PKG/shared_prefs && echo $PREF | base64 -d > /data/user/0/$PKG/shared_prefs/manga_settings.xml'" || \
            adb shell "run-as $PKG sh -c 'mkdir -p /data/user/0/$PKG/shared_prefs && echo $PREF | base64 -d > /data/user/0/$PKG/shared_prefs/manga_settings.xml'"
          adb logcat -c || true
          adb shell am start -W -n $PKG/.MainActivity || true
          sleep 20
          python3 .ci_scripts/tap_run.py || true
          python3 .ci_scripts/wait_done.py 60 || true
          adb exec-out run-as $PKG cat files/manga.log > pal-artifacts/manga_arm64.log || true
          adb logcat -d > pal-artifacts/logcat.txt 2>/dev/null || true
          adb shell "run-as $PKG ls -la files/work/out" || true
          adb exec-out run-as $PKG cat files/work/out/pl.pdf > pal-artifacts/pl.pdf || true
          # گیت ۱: لاگ باید runner=lite را نشان دهد (نه ort)
          grep -E "runner=lite|Paddle-Lite" pal-artifacts/manga_arm64.log \
            || { echo "[✗] مسیرِ Paddle-Lite فعال نشد — لاگ:"; tail -60 pal-artifacts/manga_arm64.log; exit 1; }
          # گیت ۲: استخراجِ حداقلی (۲ ناحیه) — متنِ ساده
          python3 .ci_scripts/check_extract.py pal-artifacts/manga_arm64.log 2
          test -s pal-artifacts/pl.pdf
          echo "[✓] Paddle-Lite arm64/OpenCL smoke test passed"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddle-arm64
          path: pal-artifacts/**
          if-no-files-found: warn
          retention-days: 10
