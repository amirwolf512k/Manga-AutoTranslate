name: Paddle-Lite arm64 APK (dispatch only)

# v1.14.108 — بیلدِ arm64 APK با کتابخانهٔ Paddle-Lite/OpenCL + گیت‌هایِ
# آماده‌بودن. (تستِ امولاتورِ arm64 حذف شد: امولاتورِ 37.x دیگر هیچ
# معماریِ arm را رویِ میزبانِ x86 اجرا نمی‌کند و رویِ رانرِ mac هم
# انتخابِ موتور برای arm64 پایدار نیست — تستِ واقعیِ OpenCL فقط رویِ
# گوشیِ حقیقی (Adreno/Mali) معنا دارد. مسیرِ پایتون + فال‌بک‌ها در
# android-emulator.yml (x86_64) و ocr-multilang-gate (host) پوشش داده
# می‌شوند. خروجی: APKِ arm64 برایِ نصب و تست رویِ گوشی.

on:
  workflow_dispatch:
    inputs:
      ocr_lang:
        description: 'زبانِ OCR تست'
        type: choice
        options: [en, ko, ja, zh]
        default: en

permissions:
  contents: read

jobs:
  paddle-arm64:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Python 3.10 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch vendored Python packages + Paddle-Lite libs
        run: |
          python3 android/scripts/fetch_vendor.py --check || \
            python3 android/scripts/fetch_vendor.py
          python3 android/scripts/fetch_paddle.py
          python3 android/scripts/fetch_paddle.py --check

      - name: Sync engine sources into APK
        run: python3 android/scripts/sync_sources.py

      - name: Inject version from VERSION
        run: |
          VC=$(sed -n 's/^versionCode=//p' VERSION | tr -d '[:space:]')
          VN=$(sed -n 's/^versionName=//p' VERSION | tr -d '[:space:]')
          sed -i -E "s/versionCode = .*/versionCode = $VC/; s/versionName = .*/versionName = \"$VN\"/" \
            android/app/build.gradle.kts

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build arm64 APK
        working-directory: android
        run: |
          gradle :app:assembleDebug -PappAbis="arm64-v8a" -PlegacyJni=true \
            -PchaquopyBuildPython="$(command -v python3)"
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/MangaTranslator-arm64.apk

      - name: Verify Paddle-Lite integration (libs + bridge + python chain)
        run: |
          python3 android/scripts/fetch_paddle.py --check
          test -f android/app/src/main/java/com/amirwolf/mangatranslator/PaddleLiteBridge.kt
          grep -q "PaddleLiteBridge" android/app/build.gradle.kts || true
          grep -q "class PaddleOCRLiteBackend" manga.py
          grep -q "_PLOCR_LiteRunner" manga.py
          grep -q "pplite_det_arm64_opencl.nb" manga.py
          echo "[✓] زنجیرهٔ Paddle-Lite در سورس کامل است (bridge + runner + مدل‌ها)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddle-arm64
          path: pal-artifacts/**
          if-no-files-found: warn
          retention-days: 10
