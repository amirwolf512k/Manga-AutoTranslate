name: Test Cleanup

on:
  workflow_dispatch:
    inputs:
      use_fixes:
        description: 'test branch (with fixes) — uncheck for mail branch'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.use_fixes && 'test' || 'mail' }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pillow onnxruntime \
            rapidocr-onnxruntime arabic-reshaper python-bidi

      - name: Download test images
        run: |
          mkdir -p /tmp/mt /tmp/mt/out
          cp examples/before.jpg /tmp/mt/before.jpg || true
          curl -sL --max-time 60 -o /tmp/mt/9.jpg \
            "https://imgsrv5.com/sv2/comic/1dx2/chapter-264/9.jpg" || true
          ls -la /tmp/mt

      - name: Run cleanup (LaMa phone path)
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          for IMG in /tmp/mt/before.jpg /tmp/mt/9.jpg; do
            [ -f "$IMG" ] || continue
            echo "=== Cleaning: $IMG ==="
            MANGA_LAMA_PATCH_SIDE=384 python3 manga.py \
              -i "$IMG" --clean-only --font fonts/Vazir-Code.ttf \
              --cpu --lama --clean-method lama-manga --debug \
              -o /tmp/mt/out 2>&1 | tail -25
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-results
          path: |
            /tmp/mt/out/**
            /tmp/mt/out/*.cache/debug_safe_v3/**
          if-no-files-found: warn
          retention-days: 7
