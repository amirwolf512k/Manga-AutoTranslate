name: Check HF Space

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe space status and logs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "=== space info ==="
          curl -sL -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/amirwolf512/Manga-AutoTranslate" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('stage:',d.get('runtime',{}).get('stage'));print('hardware:',d.get('runtime',{}).get('hardware'))" 2>/dev/null || true
          echo "=== runtime logs (run) ==="
          curl -sL -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/amirwolf512/Manga-AutoTranslate/logs/run" | tail -60 || true
          echo ""
          echo "=== build logs ==="
          curl -sL -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/amirwolf512/Manga-AutoTranslate/logs/build" | tail -30 || true
