name: HF Space Reset

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reset HF space to single commit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          git config --global user.name "amirwolf512"
          git config --global user.email "amirwolf512@users.noreply.github.com"
          rm -rf hf && mkdir hf && cd hf
          git clone "https://amirwolf512:${HF_TOKEN}@huggingface.co/spaces/amirwolf512/manga-autotranslate" .
          DEFBR=$(git symbolic-ref --short HEAD)
          echo "default branch: $DEFBR"
          echo "=== BEFORE ==="
          ls -la
          cp "$GITHUB_WORKSPACE/manga_app.py" app.py
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name 'app.py' ! -name 'README.md' \
            ! -name '.gitattributes' -exec rm -rf {} +
          echo "=== AFTER ==="
          ls -la
          git add -A
          git checkout --orphan fresh
          git add -A
          git commit -m "Manga AutoTranslate"
          git branch -D "$DEFBR" || true
          git branch -m "$DEFBR"
          git push -f origin "$DEFBR"
          echo "=== RESET DONE ==="
