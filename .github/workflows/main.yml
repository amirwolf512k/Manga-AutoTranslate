name: Manga Auto Translate FA

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: "لینک ورودی (صفحه مانگا / ZIP / PDF / تصویر)"
        required: true
        type: string
      provider:
        description: "ارائه‌دهنده AI"
        required: false
        default: "gemini"
        type: choice
        options:
          - gemini
          - openai
          - deepseek
          - groq
          - xai
          - openrouter
          - together
      model:
        description: "نام مدل (خالی = پیش‌فرض provider)"
        required: false
        default: ""
        type: string
      ocr_lang:
        description: "زبان OCR (مثلاً en یا ko en یا ja en)"
        required: false
        default: "en"
        type: string
      reading_order:
        description: "ترتیب خواندن"
        required: false
        default: "rtl"
        type: choice
        options:
          - rtl
          - ltr
      output_format:
        description: "فرمت خروجی"
        required: false
        default: "pdf"
        type: choice
        options:
          - pdf
          - html
          - zip

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: | #sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

      - name: Download fonts (Vazirmatn multi-weight)
        run: |
          mkdir -p fonts
          BASE="https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf"
          for w in Regular Medium SemiBold Bold ExtraBold Black Light; do
            curl -fsSL -o "fonts/Vazirmatn-${w}.ttf" "${BASE}/Vazirmatn-${w}.ttf"
          done
          echo "FONT_PATH=fonts/Vazirmatn-Regular.ttf" >> $GITHUB_ENV
          echo "FONT_SHOUT=fonts/Vazirmatn-ExtraBold.ttf" >> $GITHUB_ENV
          echo "FONT_EXPLOSION=fonts/Vazirmatn-Black.ttf" >> $GITHUB_ENV
          echo "FONT_SFX=fonts/Vazirmatn-Black.ttf" >> $GITHUB_ENV
          echo "FONT_BLACK=fonts/Vazirmatn-Bold.ttf" >> $GITHUB_ENV
          echo "FONT_THOUGHT=fonts/Vazirmatn-Light.ttf" >> $GITHUB_ENV
          echo "FONT_WHISPER=fonts/Vazirmatn-Light.ttf" >> $GITHUB_ENV
          ls -la fonts/

      - name: Resolve API key from secrets
        id: api
        env:
          GEMINI: ${{ secrets.GEMINI }}
          OPENAI: ${{ secrets.OPENAI }}
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
          GROQ: ${{ secrets.GROQ }}
          XAI: ${{ secrets.XAI }}
          OPENROUTER: ${{ secrets.OPENROUTER }}
          TOGETHER: ${{ secrets.TOGETHER }}
          API: ${{ secrets.API }}
        run: |
          PROVIDER="${{ inputs.provider }}"
          KEY=""
          case "$PROVIDER" in
            gemini)     KEY="${GEMINI:-$API}" ;;
            openai)     KEY="${OPENAI:-$API}" ;;
            deepseek)   KEY="${DEEPSEEK:-$API}" ;;
            groq)       KEY="${GROQ:-$API}" ;;
            xai)        KEY="${XAI:-$API}" ;;
            openrouter) KEY="${OPENROUTER:-$API}" ;;
            together)   KEY="${TOGETHER:-$API}" ;;
            *)          KEY="${API}" ;;
          esac

          if [ -z "$KEY" ]; then
            echo "خطا: Secret مربوط به provider «$PROVIDER» تنظیم نشده."
            echo "یکی از این‌ها را در Settings → Secrets بگذارید:"
            echo "  GEMINI / OPENAI / DEEPSEEK / GROQ /"
            echo "  XAI / OPENROUTER / TOGETHER / یا API عمومی"
            exit 1
          fi
          echo "RESOLVED_KEY=$KEY" >> $GITHUB_ENV
          echo "PROVIDER=$PROVIDER" >> $GITHUB_ENV

      - name: Run translator
        run: |
          OUT_EXT=".${{ inputs.output_format }}"
          echo "OUT_EXT=$OUT_EXT" >> $GITHUB_ENV

          MODEL_ARG=""
          if [ -n "${{ inputs.model }}" ]; then
            MODEL_ARG="--model ${{ inputs.model }}"
          fi

          python manga_translator.py \
            -i "${{ inputs.input_url }}" \
            -o "$OUT_EXT" \
            --font "$FONT_PATH" \
            --ocr-lang ${{ inputs.ocr_lang }} \
            --reading-order ${{ inputs.reading_order }} \
            --provider "$PROVIDER" \
            --api-key "$RESOLVED_KEY" \
            $MODEL_ARG \
            --cpu \
            --debug

          RESULT=$(ls -1t *"$OUT_EXT" 2>/dev/null | head -n 1 || true)
          if [ -z "$RESULT" ]; then
            echo "هیچ فایل خروجی با پسوند $OUT_EXT پیدا نشد."
            ls -la
            exit 1
          fi

          STEM=$(basename "$RESULT" "$OUT_EXT")
          echo "RESULT_FILE=$RESULT" >> $GITHUB_ENV
          echo "RESULT_STEM=$STEM" >> $GITHUB_ENV
          echo "خروجی نهایی: $RESULT"

      - name: Upload all results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_STEM }}
          path: |
            *.pdf
            *.html
            *.zip
          retention-days: 7
          if-no-files-found: error
