name: K3 Manga AutoTranslate

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: "لینک فصل / پوشه / عکس / PDF (پشتیبانی از * و چند لینک با ,)"
        required: true
        type: string
      model:
        description: "نام مدل Gemini (خالی = gemini-flash-latest)"
        required: false
        default: ""
        type: string
      output_format:
        description: "فرمت خروجی اضافه"
        required: false
        default: "pdf"
        type: choice
        options:
          - none
          - pdf
      debug:
        description: "ذخیره تصویر دیباگ با کادر سبز"
        required: false
        default: false
        type: boolean
      thinking:
        description: "حالت تفکر عمیق مدل"
        required: false
        default: true
        type: boolean
      clean:
        description: "ذخیره تصاویر پاکسازی‌شده + فایل .kmt"
        required: false
        default: false
        type: boolean

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 \
            libgomp1 curl ca-certificates

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install --no-cache-dir \
            "numpy<2.0" \
            "opencv-python-headless>=4.8,<4.10" \
            Pillow requests \
            arabic-reshaper python-bidi \
            beautifulsoup4 lxml \
            pymupdf tqdm

          # OCR
          pip install --no-cache-dir rapidocr-onnxruntime || \
          pip install --no-cache-dir rapidocr

          # inpaint اختیاری
          pip install --no-cache-dir simple-lama-inpainting || true

      - name: Download Vazirmatn fonts
        run: |
          mkdir -p "Fonts Vazirmatn"
          BASE="https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf"
          for w in Black Bold Regular ExtraBold Medium Light; do
            curl -fsSL --retry 3 -o "Fonts Vazirmatn/Vazirmatn-${w}.ttf" \
              "${BASE}/Vazirmatn-${w}.ttf" || true
          done
          # اگر دانلود شکست خورد از Noto استفاده کن
          if [ ! -f "Fonts Vazirmatn/Vazirmatn-Regular.ttf" ]; then
            echo "فونت Vazirmatn دانلود نشد؛ نصب Noto..."
            sudo apt-get install -y -qq fonts-noto-core || true
            NOTO=$(find /usr/share/fonts -name "*Noto*Arabic*Regular*.ttf" 2>/dev/null | head -1)
            if [ -n "$NOTO" ]; then
              cp "$NOTO" "Fonts Vazirmatn/Vazirmatn-Regular.ttf"
              cp "$NOTO" "Fonts Vazirmatn/Vazirmatn-Bold.ttf"
              cp "$NOTO" "Fonts Vazirmatn/Vazirmatn-Black.ttf"
            fi
          fi
          ls -la "Fonts Vazirmatn/" || true

      - name: Resolve API key
        id: api
        env:
          GEMINI: ${{ secrets.GEMINI }}
          API: ${{ secrets.API }}
        run: |
          KEY="${GEMINI:-$API}"
          if [ -z "$KEY" ]; then
            echo "::error::Secret کلید API تنظیم نشده."
            echo "در Settings → Secrets and variables → Actions"
            echo "یک Secret به اسم GEMINI (یا API) بسازید و کلید Gemini را بگذارید."
            echo "برای چند کلید: key1,key2,key3"
            exit 1
          fi
          echo "RESOLVED_KEY=$KEY" >> $GITHUB_ENV
          echo "کلید API پیدا شد."

      - name: Run k3mat
        run: |
          set -e

          EXTRA_ARGS="--auto-yes"
          if [ "${{ inputs.debug }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --debug"
          fi
          if [ "${{ inputs.thinking }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --thinking"
          fi
          if [ "${{ inputs.clean }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --clean"
          fi
          if [ "${{ inputs.output_format }}" = "pdf" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --pdf"
          fi

          MODEL_ARG=""
          if [ -n "${{ inputs.model }}" ]; then
            MODEL_ARG="--model ${{ inputs.model }}"
          fi

          echo "ورودی: ${{ inputs.input_url }}"
          echo "آرگومان‌های اضافه: $EXTRA_ARGS $MODEL_ARG"

          python manga_translator.py \
            "${{ inputs.input_url }}" \
            --api-key "$RESOLVED_KEY" \
            $MODEL_ARG \
            $EXTRA_ARGS

          echo "------ لیست فایل‌های تولیدشده ------"
          find . -type f \( -name "*_final.png" -o -name "*_debug.png" -o -name "*.pdf" -o -name "*.kmt" \) | head -50
          ls -la

      - name: Collect outputs
        id: collect
        run: |
          mkdir -p output
          # خروجی‌های نهایی و دیباگ
          find . -type f \( -name "*_final.png" -o -name "*_debug.png" -o -name "*.pdf" -o -name "*.kmt" \) \
            -not -path "./output/*" -exec cp {} output/ \; 2>/dev/null || true
          # پوشه‌های AutoTranslate
          find . -type d -name "AutoTranslate_*" -exec cp -r {} output/ \; 2>/dev/null || true
          find . -type d -name "AutoClean_*" -exec cp -r {} output/ \; 2>/dev/null || true

          COUNT=$(find output -type f | wc -l)
          echo "تعداد فایل خروجی: $COUNT"
          ls -laR output || true

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::هیچ فایل خروجی پیدا نشد؛ کل workspace آپلود می‌شود."
            echo "HAS_OUTPUT=false" >> $GITHUB_ENV
          else
            echo "HAS_OUTPUT=true" >> $GITHUB_ENV
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: k3mat-output
          path: |
            output/**
            **/*_final.png
            **/*_debug.png
            **/*.pdf
            **/*.kmt
          retention-days: 7
          if-no-files-found: warn
