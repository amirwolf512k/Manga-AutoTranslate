name: API + Full Chapter Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      gemini_best: ${{ steps.gem.outputs.best }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gemini — 3 keys x 2 models
        id: gem
        env:
          KEYS: ${{ secrets.TEST_GEMINI_KEYS }}
        run: python3 .ci_tmp/gemini_test.py

      - name: CoArena — gpt-6-luna
        env:
          KEY: ${{ secrets.TEST_COARENA_KEY }}
          BASE: ${{ secrets.TEST_COARENA_BASE }}
        run: python3 .ci_tmp/coarena_test.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: |
            gemini_report.json
          if-no-files-found: ignore

  quality-coarena:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

      - name: Install python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt beautifulsoup4 google-genai

      - name: Run quality pages (ko / ja / zh / en — real ci_imgs pages)
        env:
          COARENA_KEY: ${{ secrets.TEST_COARENA_KEY }}
          COARENA_BASE: ${{ secrets.TEST_COARENA_BASE }}
        run: |
          set -o pipefail
          run_one () {
            NAME="$1"; IMG="$2"; shift 2
            echo "=================================================="
            echo ">>> $NAME  ($IMG)"
            echo "=================================================="
            python3 manga.py \
              -i "ci_imgs/$IMG" \
              -o "out_q_${NAME}.pdf" \
              --provider custom \
              --api-base "$COARENA_BASE" \
              --model gpt-6-luna \
              --api-key "$COARENA_KEY" \
              --font fonts/Sahel-Bold.ttf \
              --no-style-fonts \
              --api-timeout 120 \
              --batch-workers 2 \
              --ocr-lang "$@" \
              2>&1 | tee "q_${NAME}.log" || echo "[!] $NAME FAILED (ادامه)"
          }
          run_one ko lang_ko.jpg ko en
          run_one ja lang_ja_bw.jpg ja en
          run_one zh lang_zh.jpg zh
          run_one en up0822_en.jpg en

      - name: Collect translations
        if: always()
        run: |
          mkdir -p qtrans
          for d in out_q_*.cache; do
            [ -d "$d" ] || continue
            if [ -f "$d/trans.json" ]; then
              cp "$d/trans.json" "qtrans/${d%.cache}_trans.json" || true
            fi
          done
          ls -la qtrans/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-coarena
          path: |
            out_q_*.pdf
            q_*.log
            qtrans/
          if-no-files-found: warn

  chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: asura, n: "101",        url: "https://asurascans.com/comics/damn-reincarnation-7ba78ec7/chapter/101",  lang: "en" }
          - { site: asura, n: "133",        url: "https://asurascans.com/comics/breakers-7ba78ec7/chapter/133",            lang: "en" }
          - { site: asura, n: "99",         url: "https://asurascans.com/comics/absolute-domination-7ba78ec7/chapter/99",  lang: "en" }
          - { site: mgeko, n: "ch0.5",      url: "https://www.mgeko.cc/reader/en/1xy7-the-heavenly-demon-destroys-the-tower-chapter-0-5-eng-li/", lang: "en" }
          - { site: mgeko, n: "ch1",        url: "https://www.mgeko.cc/reader/en/3fhl-isekai-harry-potter-chapter-1-eng-li/",             lang: "en" }
          - { site: mgeko, n: "ch1b",       url: "https://www.mgeko.cc/reader/en/m5p8-the-purgatory-artist-chapter-1-eng-li/",              lang: "en" }
          - { site: naver, n: "orv-1",      url: "https://m.comic.naver.com/webtoon/detail?titleId=747269&no=1",  lang: "ko en" }
          - { site: naver, n: "tog-1",      url: "https://m.comic.naver.com/webtoon/detail?titleId=183559&no=1",  lang: "ko en" }
          - { site: naver, n: "beauty-1",   url: "https://m.comic.naver.com/webtoon/detail?titleId=783052&no=1",  lang: "ko en" }
          - { site: zymk,  n: "cn-100",     url: "https://www.zymk.cn/100/375405.html", lang: "zh" }
          - { site: zymk,  n: "cn-101",     url: "https://www.zymk.cn/101/434914.html", lang: "zh" }
          - { site: zymk,  n: "cn-103",     url: "https://www.zymk.cn/103/414572.html", lang: "zh" }
    env:
      COARENA_KEY: ${{ secrets.TEST_COARENA_KEY }}
      COARENA_BASE: ${{ secrets.TEST_COARENA_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

      - name: Install python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt beautifulsoup4 google-genai

      - name: Run full chapter (${{ matrix.site }} ${{ matrix.n }})
        run: |
          set -o pipefail
          OUT="out_${{ matrix.site }}_${{ matrix.n }}.pdf"
          python3 manga.py \
            -i "${{ matrix.url }}" \
            -o "$OUT" \
            --provider custom \
            --api-base "$COARENA_BASE" \
            --model gpt-6-luna \
            --api-key "$COARENA_KEY" \
            --font fonts/Sahel-Bold.ttf \
            --no-style-fonts \
            --api-timeout 120 \
            --batch-workers 2 \
            --ocr-lang ${{ matrix.lang }} \
            2>&1 | tee run.log
          echo "---- خروجی ----"
          ls -la "$OUT" || echo "[!] خروجی ساخته نشد"

      - name: Collect translations
        if: always()
        run: |
          mkdir -p chtrans
          d="out_${{ matrix.site }}_${{ matrix.n }}.cache"
          if [ -f "$d/trans.json" ]; then
            cp "$d/trans.json" "chtrans/${{ matrix.site }}_${{ matrix.n }}_trans.json" || true
          fi
          ls -la chtrans/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-${{ matrix.site }}-${{ matrix.n }}
          path: |
            out_*.pdf
            run.log
            chtrans/
          if-no-files-found: warn

  chapter-mangaplus:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      COARENA_KEY: ${{ secrets.TEST_COARENA_KEY }}
      COARENA_BASE: ${{ secrets.TEST_COARENA_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

      - name: Install python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt beautifulsoup4 google-genai

      - name: Discover free chapter (One Piece)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = ("https://jumpg-webapi.tokyo-cdn.com/api/title_detailV3"
                 "?title_id=100020&clang=English")
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              d = json.load(r)
          found = []
          def walk(o):
              if isinstance(o, dict):
                  if isinstance(o.get("chapterId"), int):
                      found.append(o)
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for v in o:
                      walk(v)
          walk(d)
          print("chapter nodes:", len(found))
          free = [c for c in found if not c.get("isLocked")]
          if not free:
              raise SystemExit("هیچ فصل آزادی پیدا نشد")
          c = free[0]
          print("picked:", c.get("chapterId"), c.get("chapterSubtitle"))
          open("/tmp/mp_cid.txt", "w").write(str(c["chapterId"]))
          PY
          cat /tmp/mp_cid.txt

      - name: Run full chapter (mangaplus ja)
        run: |
          set -o pipefail
          CID=$(cat /tmp/mp_cid.txt)
          python3 manga.py \
            -i "https://mangaplus.shueisha.co.jp/viewer/$CID" \
            -o out_mangaplus_ja.pdf \
            --provider custom \
            --api-base "$COARENA_BASE" \
            --model gpt-6-luna \
            --api-key "$COARENA_KEY" \
            --font fonts/Sahel-Bold.ttf \
            --no-style-fonts \
            --api-timeout 120 \
            --batch-workers 2 \
            --ocr-lang ja en \
            2>&1 | tee run.log
          ls -la out_mangaplus_ja.pdf || echo "[!] خروجی ساخته نشد"

      - name: Collect translations
        if: always()
        run: |
          mkdir -p chtrans
          if [ -f "out_mangaplus_ja.cache/trans.json" ]; then
            cp "out_mangaplus_ja.cache/trans.json" chtrans/mangaplus_trans.json || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-mangaplus-ja
          path: |
            out_mangaplus_ja.pdf
            run.log
            chtrans/
          if-no-files-found: warn

  chapters-gemini:
    needs: api-tests
    if: needs.api-tests.outputs.gemini_best != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { n: "mgeko-ch0.5", url: "https://www.mgeko.cc/reader/en/1xy7-the-heavenly-demon-destroys-the-tower-chapter-0-5-eng-li/", lang: "en" }
          - { n: "naver-tog-1", url: "https://m.comic.naver.com/webtoon/detail?titleId=183559&no=1", lang: "ko en" }
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

      - name: Install python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt beautifulsoup4 google-genai

      - name: Run full chapter with Gemini
        env:
          GBEST: ${{ needs.api-tests.outputs.gemini_best }}
        run: |
          set -o pipefail
          GKEY="${GBEST%%|*}"
          GMODEL="${GBEST##*|}"
          echo "model: $GMODEL"
          python3 manga.py \
            -i "${{ matrix.url }}" \
            -o "out_gem_${{ matrix.n }}.pdf" \
            --provider gemini \
            --model "$GMODEL" \
            --api-key "$GKEY" \
            --font fonts/Sahel-Bold.ttf \
            --no-style-fonts \
            --api-timeout 90 \
            --batch-workers 2 \
            --ocr-lang ${{ matrix.lang }} \
            2>&1 | tee run.log
          ls -la "out_gem_${{ matrix.n }}.pdf" || echo "[!] خروجی ساخته نشد"

      - name: Collect translations
        if: always()
        run: |
          mkdir -p chtrans
          if [ -f "out_gem_${{ matrix.n }}.cache/trans.json" ]; then
            cp "out_gem_${{ matrix.n }}.cache/trans.json" "chtrans/gem_${{ matrix.n }}_trans.json" || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-gemini-${{ matrix.n }}
          path: |
            out_gem_*.pdf
            run.log
            chtrans/
          if-no-files-found: warn
